<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立数据消费示例 · 非现有地图界面</title><style>body{max-width:900px;margin:32px auto;padding:0 20px;font:16px/1.7 system-ui;color:#183b47;background:#f4f8f7}svg{width:100%;background:white;border:1px solid #b3c6c9}button,select{font:inherit;padding:6px}pre{white-space:pre-wrap;background:white;padding:16px}a{color:#125b77}small{display:block}circle{fill:#176d89}line{stroke:#60777e}text{font:12px system-ui;fill:#34545f}.missing{fill:none;stroke:#9f7950}</style><h1>从数据重做界面：最小独立例子</h1><p>此页没有导入现有地图、菜单、CSS 或 Three.js。它只使用研究契约，演示另一套前端如何从零组织真实数据。</p><label>同月跨年 <select id="month"><option value="7">7月</option><option value="8">8月</option></select></label><p id="status">正在读取资料…</p><svg id="chart" viewBox="0 0 850 290" aria-label="研究区同月跨年分类水面面积"></svg><small>点为合格月分类值；空心标记为缺测/未达门槛，不补零、不画虚构插值。单位：ha。此范例不是原网页完整功能替代品。</small><details><summary>数据与几何追溯</summary><pre id="meta"></pre></details><p><a href="README.md">契约说明</a> · <a href="catalog.json">机器可读目录</a> · <a href="REBUILD_BRIEF.md">独立重构约定</a></p><script type="module">
import {createResearchClient,selectSameMonthPoints,featureById} from './index.js';
const client=createResearchClient();
try {
 const [{data:series,descriptor},{data:features}]=await Promise.all([client.dataset('anchored-series'),client.dataset('spatial-features')]);
 const s=series.series.find(x=>x.id==='water-local_KMZ'),anchor=featureById(features,'local-office');
 const draw=()=>{const points=selectSameMonthPoints(s.points,+document.querySelector('#month').value,{startYear:2000,endYear:2024});const max=180,x=i=>48+i*31,y=v=>240-v/max*200;
 document.querySelector('#chart').innerHTML='<line x1="40" y1="240" x2="820" y2="240"/><text x="10" y="25">ha</text>'+[0,60,120,180].map(v=>`<text x="8" y="${y(v)+4}">${v}</text>`).join('')+points.map((p,i)=>`${p.value==null?`<circle class="missing" cx="${x(i)}" cy="253" r="3"><title>${p.date}：缺测或未达门槛</title></circle>`:`<circle cx="${x(i)}" cy="${y(p.value)}" r="4"><title>${p.date}：${p.value.toFixed(2)} ha${p.classification_dispute?'，分类有争议':''}</title></circle>`}${i%4===0?`<text x="${x(i)-14}" y="279">${p.date.slice(0,4)}</text>`:''}`).join('');
 document.querySelector('#status').textContent=`${s.title}：2000–2024年${document.querySelector('#month').value}月，共${points.length}个历年位置，${points.filter(p=>p.value!=null).length}个有值。日期严格配对，争议标记保留。`;
 document.querySelector('#meta').textContent=JSON.stringify({dataset:descriptor.id,sha256:descriptor.sha256,scope:s.scope,spatial_reference_example:anchor,first_record:points[0]},null,2);};
 document.querySelector('#month').onchange=draw;draw();
} catch(e){document.querySelector('#status').textContent='读取失败：'+e.message;}
</script></html>
