<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呼吉尔诺尔 · 屏幕布局预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eff2;color:#183d4d;font:14px/1.5 system-ui,sans-serif}header{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header p{margin:0}button,a{padding:6px 10px;color:inherit}main{padding:0 12px 12px;overflow:auto}iframe{display:block;border:0;background:white;box-shadow:0 2px 14px #2344}small{color:#486575}</style></head><body><header><p><b>屏幕布局预览</b><br><small>内嵌窗口验证响应布局，不等同真实手机、触摸或 Safari 验收。</small></p><button data-size="1440,900">1440 × 900（缩放预览）</button><button data-size="390,600">390 × 600</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><a href="./" target="_blank" rel="noopener">打开完整网页</a></header><main><iframe id="preview" title="呼吉尔诺尔窄屏预览" width="390" height="600" src="./"></iframe></main><script>for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.getElementById('preview');f.width=w;f.height=h;const scale=Math.min(1,(innerWidth-28)/Number(w));f.style.transformOrigin='top left';f.style.transform='scale('+scale+')';f.parentElement.style.height=(Number(h)*scale+16)+'px';};</script></body></html>
