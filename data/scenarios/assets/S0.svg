<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">不建设，先把变化看清</title><desc id="d">原创机制示意；虚线箭头表示条件性比较，不是现场工程或已验证因果。</desc><rect width="720" height="300" rx="20" fill="#102b35"/><text x="28" y="38" font-size="20" fill="#f5f4e9" font-family="sans-serif">不建设，先把变化看清</text><text x="28" y="64" font-size="13" fill="#9bb4bd" font-family="sans-serif">原创示意 · 非现场照片 · 非建成效果</text><rect x="32" y="92" width="192" height="130" rx="16" fill="#65c8ac" fill-opacity=".10" stroke="#65c8ac"/><path d="M62 155 L96 127 L130 155 M72 151 V180 H120 V151 M158 180 V145 M158 160 l-16 -14 M158 166 l17 -18" fill="none" stroke="#65c8ac" stroke-width="3"/><text x="128" y="209" text-anchor="middle" font-size="16" fill="#f5f4e9" font-family="sans-serif">既有节点待核</text><path d="M232 154 h24 l-7 -5 m7 5 l-7 5" fill="none" stroke="#abc0c6" stroke-width="2" stroke-dasharray="4 3"/><rect x="264" y="92" width="192" height="130" rx="16" fill="#78b8dd" fill-opacity=".10" stroke="#78b8dd"/><path d="M291 153 Q319 125 357 147 T429 149 Q438 178 361 181 T291 153Z" fill="#78b8dd" fill-opacity=".3" stroke="#78b8dd" stroke-dasharray="5 4"/><path d="M319 158 Q352 148 403 161" stroke="#78b8dd" fill="none"/><text x="360" y="209" text-anchor="middle" font-size="16" fill="#f5f4e9" font-family="sans-serif">远观湖盆</text><path d="M464 154 h24 l-7 -5 m7 5 l-7 5" fill="none" stroke="#abc0c6" stroke-width="2" stroke-dasharray="4 3"/><rect x="496" y="92" width="192" height="130" rx="16" fill="#e8bc7c" fill-opacity=".10" stroke="#e8bc7c"/><path d="M549 126 h80 v55 h-80 Z M562 141 h53 M562 154 h40 M562 167 h47" fill="none" stroke="#e8bc7c" stroke-width="3"/><text x="592" y="209" text-anchor="middle" font-size="16" fill="#f5f4e9" font-family="sans-serif">记录与关闭</text><text x="28" y="253" font-size="14" fill="#e5c894" font-family="sans-serif">位置是调查入口，不是建设位置；条件不满足就缩小或不做。</text><text x="28" y="277" font-size="12" fill="#9bb4bd" font-family="sans-serif">虚线箭头＝待核条件关系；不表示已实现效果或工程线路。</text></svg>